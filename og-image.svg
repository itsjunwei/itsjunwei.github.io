<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Yeow Jun Wei — 3-D Sound Event Localization and Detection — Nanyang Technological University">
  <!--
    Source for og-image.png. Colours and type are copied from style.css
    (light scheme). The mark is the site's own favicon geometry; no
    third-party logos. See README.md for how to regenerate the PNG.

    Note: this file must be served over HTTP when rendered, not opened from
    the filesystem, or the @font-face below is blocked by CORS and the card
    silently falls back to a system font.

    Keep double hyphens out of these comments; they are illegal in XML and
    make the file unparseable when served as image/svg+xml.
  -->
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("fonts/ibm-plex-sans-latin.woff2") format("woff2");
      font-weight: 100 700;
      font-style: normal;
    }
    .bg     { fill: #fdfdfb; }
    .serif,
    .sans   { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .name   { fill: #1c1c1a; font-size: 78px; font-weight: 600; letter-spacing: -0.015em; }
    .phrase { fill: #1c1c1a; font-size: 44px; }
    .org    { fill: #55534d; font-size: 27px; letter-spacing: 0.01em; }
    .accent { fill: #1a4f8a; }
    .mark   { fill: none; stroke: #1a4f8a; stroke-width: 2.6; stroke-linecap: round; }
    .dot    { fill: #1a4f8a; }
  </style>

  <rect class="bg" width="1200" height="630"/>

  <!-- site mark, from favicon.svg (viewBox 0 0 32 32) -->
  <g transform="translate(90 140) scale(1.8)">
    <circle class="dot" cx="9" cy="16" r="3.2"/>
    <path class="mark" d="M13.59 9.45 A8 8 0 0 1 13.59 22.55"/>
    <path class="mark" d="M16.46 5.35 A13 13 0 0 1 16.46 26.65"/>
  </g>

  <rect class="accent" x="90" y="248" width="104" height="4"/>

  <text class="serif name"   x="90" y="352">Yeow Jun Wei</text>
  <text class="serif phrase" x="90" y="432">3-D Sound Event Localization and Detection</text>
  <text class="sans  org"    x="90" y="506">Nanyang Technological University, Singapore</text>
</svg>
